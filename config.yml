backend:
  name: github
  repo: ronijbarahi/jungle
  branch: main
  # base_url is the address of your login helper.
  # Replace this with your own Cloudflare Worker URL from SETUP.md step 4.
  base_url: https://REPLACE-ME.workers.dev

# Where uploaded images are stored in the repo.
media_folder: "uploads"
public_folder: "uploads"

# Saves straight to the site instead of creating drafts to approve.
publish_mode: simple

collections:
  - name: site
    label: Site
    files:
      - name: projects
        label: Projects
        file: data/projects.json
        format: json
        description: Every project shown on the homepage and in case studies.
        fields:
          - name: projects
            label: Projects
            label_singular: Project
            widget: list
            summary: "{{fields.no}} — {{fields.name}}"
            fields:
              - { name: name, label: Project name, widget: string }
              - {
                  name: slug,
                  label: Web address name,
                  widget: string,
                  hint: "Lowercase, no spaces, dashes instead. This becomes project.html?p=your-slug. Do not change it once the project is live.",
                  pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and dashes only"]
                }
              - { name: no, label: Number shown on the tile, widget: string, hint: "e.g. 01" }
              - { name: tags, label: Tile subtitle, widget: string, hint: "Short. Shows under the name on the homepage. e.g. Rebrand · Packaging" }

              - { name: client, label: Client, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: scope, label: Scope, widget: string, hint: "e.g. Identity · Web · Product" }
              - { name: role, label: Our role, widget: string }

              - { name: lede, label: One-line summary, widget: text }
              - { name: challenge, label: The challenge, widget: text }
              - { name: approach, label: Our approach, widget: text }

              - { name: quote, label: Client quote, widget: text, required: false, hint: "Leave empty unless the client actually said this and is happy to be quoted." }
              - { name: quoteBy, label: Quote attributed to, widget: string, required: false, hint: "Name, role, company. Leave empty if there is no quote." }

              - { name: thumb, label: Homepage tile image, widget: image }
              - { name: heroImage, label: Case study hero image, widget: image }
              - { name: imageA, label: Detail image A, widget: image }
              - { name: imageB, label: Detail image B, widget: image }
              - { name: imageC, label: Wide image C, widget: image }

              - name: results
                label: Results
                widget: list
                required: false
                hint: "Only put numbers here you could show a client if asked."
                fields:
                  - { name: figure, label: Figure, widget: string, hint: "e.g. +47%" }
                  - { name: label, label: What it means, widget: string }
